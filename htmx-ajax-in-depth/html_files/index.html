<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTMX@AXUM.EU.ORG</title>
  </head>
  <body>
    <input
      type="text"
      name="keyword"
      hx-post="/api/topics"
      hx-trigger="keyup changed delay:500ms"
      hx-target="#search-results"
      placeholder="输入关键字进行搜索"
    />
    <ul id="search-results" hx-get="/api/topics" hx-trigger="load"></ul>
    <script
      src="https://lib.axum.eu.org/htmx/2.0.10/htmx.min.js"
      defer
    ></script>
  </body>
</html>
